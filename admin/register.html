<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Mizana Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="../CSS/admin/register.css">
</head>

<body>
    <nav class="navbar">
        <a href="../index.html" class="logo">
            <img src="../asset/logo.png" alt="">
            <span>MIZANA PRO</span>
        </a>
        <div class="nav-links">
            <a href="../admin/login.html">Login</a>
        </div>
    </nav>

    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h2>Create Account</h2>
                <p>Already have an account? <a href="../admin/login.html">Log in</a></p>
            </div>

            <form>
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" placeholder="Enter your full name" required>
                </div>

                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" placeholder="you@example.com" required>
                </div>

                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="tel" placeholder="e.g., 08012345678" required>
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <input type="password" placeholder="Create a strong password" required>
                </div>

                <div class="form-group">
                    <label>Confirm Password</label>
                    <input type="password" placeholder="Re-enter password" required>
                </div>

                <label class="terms">
                    <input type="checkbox" required> I agree to the <a href="#">Terms of Service</a> and <a
                        href="#">Privacy Policy</a>
                </label>

                <button type="submit" class="auth-btn">Sign Up</button>
                <div class="mt-8 pt-6 border-t border-gray-100">
                    <div class="flex items-center justify-around opacity-60">
                        <div class="flex flex-col items-center">
                            <i class="fas fa-shield-halved text-green-600 mb-1"></i>
                            <span class="text-[10px] uppercase font-bold tracking-widest text-gray-600">End-to-End
                                Encrypted</span>
                        </div>
                        <div class="flex flex-col items-center">
                            <i class="fas fa-database text-blue-600 mb-1"></i>
                            <span class="text-[10px] uppercase font-bold tracking-widest text-gray-600">Cloud
                                Synced</span>
                        </div>
                    </div>
                </div>
                <div class="flex flex-col items-center">
                    <i class="fas fa-shield-halved text-green-600 mb-1"></i>
                    <span class="text-[10px] uppercase font-bold tracking-widest text-gray-600">Powered by Abbah
                        El-Nakeedy Dev Hub</span>
                </div>
            </form>
        </div>
    </div>
    <script type="module" src="../JS/firebase-config.js"></script>

</body>
</html>
