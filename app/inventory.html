<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>Mizana Pro · Inventory</title>
    <script src="../JS/theme.js"></script>
    <script src="https://cdntailwindcss.com"></script>
    <link rel="stylesheet" href="../src/assets/css/all.min.css">
    <link rel="stylesheet" href="../src/output.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            main: '#132B77',
                            accent: '#0A89A4',
                            danger: '#e74c3c',
                            cyan: '#16B2C1'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .stock-bar {
            height: 4px;
            border-radius: 2px;
        }

        .price-edit {
            cursor: pointer;
        }

        .price-edit:hover {
            opacity: 0.8;
        }

        .price-edit i {
            color: #9ca3af;
            transition: color 0.2s;
        }

        .price-edit:hover i {
            color: #0A89A4;
        }

        #productModal {
            transition: opacity 0.2s ease;
        }

        .action-btn {
            cursor: pointer;
            transition: color 0.2s;
        }

        .action-btn:hover {
            opacity: 0.8;
        }
    </style>
</head>

<body class="bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100 min-h-screen">

    <header class="bg-white dark:bg-gray-800 border-b dark:border-gray-700 border-gray-200 p-4 sticky top-0 z-20">
        <div class="flex items-center justify-between mb-4">
            <div class="flex items-center gap-4">
                <button onclick="window.history.back()"
                    class="w-10 h-10 flex items-center justify-center rounded-lg bg-gray-100 dark:bg-gray-700 text-brand-main dark:text-white hover:bg-gray-200 dark:hover:bg-gray-600 transition">
                    <i class="fas fa-arrow-left"></i>
                </button>
                <h1 class="text-2xl font-black dark:text-white">Inventory</h1>
            </div>
            <div class="flex gap-2">
                <button onclick="resetFilters()"
                    class="w-10 h-10 bg-gray-100 dark:bg-gray-700 rounded-full flex items-center justify-center text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-600 transition">
                    <i class="fas fa-filter text-xs"></i>
                </button>
                <button onclick="window.location.href='upload.html'"
                    class="bg-brand-accent text-brand-main px-4 py-2 rounded-xl text-xs font-black flex items-center gap-2 shadow-lg hover:bg-opacity-90 transition">
                    <i class="fas fa-plus"></i> NEW PRODUCT
                </button>
            </div>
        </div>

        <div class="relative mb-4">
            <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
            <input type="text" id="searchInput" placeholder="Search by name, SKU or barcode..."
                class="w-full bg-gray-100 dark:bg-gray-700 border-none rounded-2xl py-3 pl-12 pr-4 outline-none focus:ring-2 focus:ring-brand-accent transition-all text-sm">
        </div>

        <!-- Filter chips (scrollable) -->
        <div class="flex gap-2 overflow-x-auto no-scrollbar pb-1">
            <button onclick="filterByAll()"
                class="filter-chip active shrink-0 px-4 py-2 rounded-full bg-brand-main text-white dark:bg-brand-accent dark:text-brand-main text-[10px] font-black uppercase"
                data-category="all">All Items (<span id="totalCount">0</span>)</button>
            <button onclick="filterByLowStock()"
                class="filter-chip shrink-0 px-4 py-2 rounded-full bg-red-100 text-red-600 dark:bg-red-900/30 dark:text-red-400 text-[10px] font-black uppercase"
                data-category="low">Low Stock (<span id="lowCount">0</span>)</button>
            <button onclick="filterByOutOfStock()"
                class="filter-chip shrink-0 px-4 py-2 rounded-full border dark:border-gray-700 border-gray-200 text-[10px] font-black uppercase"
                data-category="out">Out of Stock</button>
            <button onclick="filterByExpired()"
                class="filter-chip shrink-0 px-4 py-2 rounded-full border dark:border-gray-700 border-gray-200 text-[10px] font-black uppercase"
                data-category="expired">Expired (<span id="expiredCount">0</span>)</button>

        </div>
    </header>

    <main id="productList" class="p-4 space-y-3 pb-24"></main>

    <!-- Product Detail Modal -->
    <div id="productModal"
        class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4"
        onclick="if(event.target===this) closeProductModal()">
        <div class="bg-white dark:bg-gray-800 w-full max-w-md rounded-3xl shadow-2xl overflow-hidden">
            <div class="p-6 border-b dark:border-gray-700 border-gray-200 flex justify-between items-center">
                <h2 class="text-xl font-black dark:text-white">Product Details</h2>
                <button onclick="closeProductModal()"
                    class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-200">
                    <i class="fas fa-times text-xl"></i>
                </button>
            </div>
            <div class="p-6 space-y-4 max-h-[70vh] overflow-y-auto">
                <div class="flex items-center gap-4">
                    <div class="w-16 h-16 bg-gray-100 dark:bg-gray-700 rounded-2xl flex items-center justify-center overflow-hidden"
                        id="modalProductImageContainer">
                        <span id="modalProductImage" class="hidden">📦</span>
                    </div>
                    <div>
                        <h3 id="modalProductName" class="font-black text-lg dark:text-white"></h3>
                        <p class="text-sm text-gray-500 dark:text-gray-400" id="modalProductBarcode"></p>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div class="bg-gray-50 dark:bg-gray-700/50 p-3 rounded-xl">
                        <p class="text-[10px] text-gray-500 dark:text-gray-400 uppercase">Selling (per piece)</p>
                        <p id="modalProductPricePiece" class="font-bold text-brand-accent"></p>
                    </div>
                    <div class="bg-gray-50 dark:bg-gray-700/50 p-3 rounded-xl">
                        <p class="text-[10px] text-gray-500 dark:text-gray-400 uppercase">Selling (per pkg)</p>
                        <p id="modalProductPrice" class="font-bold text-gray-800 dark:text-white"></p>
                    </div>
                    <div class="bg-gray-50 dark:bg-gray-700/50 p-3 rounded-xl">
                        <p class="text-[10px] text-gray-500 dark:text-gray-400 uppercase">Cost per Package</p>
                        <p id="modalProductBuyingPrice" class="font-bold text-gray-800 dark:text-white"></p>
                    </div>
                    <div class="bg-gray-50 dark:bg-gray-700/50 p-3 rounded-xl">
                        <p class="text-[10px] text-gray-500 dark:text-gray-400 uppercase">Stock (pieces)</p>
                        <p id="modalProductStock" class="font-bold"></p>
                    </div>
                    <div class="bg-gray-50 dark:bg-gray-700/50 p-3 rounded-xl">
                        <p class="text-[10px] text-gray-500 dark:text-gray-400 uppercase">Category</p>
                        <p id="modalProductCategory" class="font-bold"></p>
                    </div>
                    <div class="bg-gray-50 dark:bg-gray-700/50 p-3 rounded-xl">
                        <p class="text-[10px] text-gray-500 dark:text-gray-400 uppercase">Pieces per Pkg</p>
                        <p id="modalProductPiecesPerPackage" class="font-bold"></p>
                    </div>
                    <div class="bg-gray-50 dark:bg-gray-700/50 p-3 rounded-xl">
                        <p class="text-[10px] text-gray-500 dark:text-gray-400 uppercase">Packages</p>
                        <p id="modalProductPackages" class="font-bold"></p>
                    </div>
                    <div class="bg-gray-50 dark:bg-gray-700/50 p-3 rounded-xl col-span-2">
                        <p class="text-[10px] text-gray-500 dark:text-gray-400 uppercase">Expiry Date</p>
                        <p id="modalProductExpiry" class="font-bold"></p>
                    </div>
                    <div class="bg-gray-50 dark:bg-gray-700/50 p-3 rounded-xl col-span-2">
                        <p class="text-[10px] text-gray-500 dark:text-gray-400 uppercase">Purchase ID</p>
                        <p id="modalProductPurchaseId" class="font-bold text-xs truncate"></p>
                    </div>
                    <div class="bg-gray-50 dark:bg-gray-700/50 p-3 rounded-xl col-span-2">
                        <p class="text-[10px] text-gray-500 dark:text-gray-400 uppercase">Created</p>
                        <p id="modalProductCreated" class="font-bold"></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div
        class="fixed bottom-0 left-0 right-0 p-4 bg-white/80 dark:bg-gray-900/80 backdrop-blur-lg border-t dark:border-gray-800 border-gray-200 flex justify-around">
        <button onclick="window.location.href='inventory.html'"
            class="flex flex-col items-center gap-1 text-brand-accent">
            <i class="fas fa-boxes text-xl"></i>
            <span class="text-[10px] font-black uppercase">Stock</span>
        </button>
        <button onclick="window.location.href='bulk-import.html'"
            class="flex flex-col items-center gap-1 text-gray-400">
            <i class="fas fa-file-import text-xl"></i>
            <span class="text-[10px] font-black uppercase">Bulk Import</span>
        </button>
        <button onclick="window.location.href='price-logs.html'" class="flex flex-col items-center gap-1 text-gray-400">
            <i class="fas fa-exchange-alt text-xl"></i>
            <span class="text-[10px] font-black uppercase">Price Logs</span>
        </button>
        <button onclick="window.location.href='damage.html'" class="flex flex-col items-center gap-1 text-red-500">
            <i class="fas fa-trash-alt text-xl"></i>
            <span class="text-[10px] font-black uppercase">Waste</span>
        </button>
    </div>

    <div id="toast"
        class="fixed bottom-24 left-1/2 transform -translate-x-1/2 bg-gray-900 text-white px-6 py-3 rounded-full text-sm font-bold shadow-lg z-50 hidden">
        Price updated
    </div>

    <script>
        const prefersDark = localStorage.getItem('darkMode') === 'true';
        if (prefersDark) document.body.classList.add('dark');

        let products = [];
        let filteredProducts = [];

        function loadProducts() {
            const stored = localStorage.getItem('products');
            products = stored ? JSON.parse(stored) : [];
            filteredProducts = [...products];
            renderProducts();
            updateCounts();
        }

        function saveProducts() {
            localStorage.setItem('products', JSON.stringify(products));
        }

        function logPriceChange(product, oldPrice, newPrice) {
            let priceLogs = JSON.parse(localStorage.getItem('priceLogs') || '[]');
            priceLogs.push({
                id: Date.now(),
                productId: product.id,
                productName: product.name,
                oldPrice,
                newPrice,
                timestamp: new Date().toISOString(),
                changedBy: localStorage.getItem('userRole') || 'staff',
                img: product.img
            });
            if (priceLogs.length > 100) priceLogs.shift();
            localStorage.setItem('priceLogs', JSON.stringify(priceLogs));
        }

        function showProductDetails(product) {
            const container = document.getElementById('modalProductImageContainer');
            const isBase64 = product.img && product.img.startsWith('data:image');
            if (isBase64) {
                container.innerHTML = `<img src="${product.img}" class="w-16 h-16 object-cover rounded-2xl">`;
            } else {
                container.innerHTML = `<span class="text-3xl">${product.img || '📦'}</span>`;
            }

            document.getElementById('modalProductName').innerText = product.name;
            document.getElementById('modalProductBarcode').innerText = product.barcode || 'N/A';
            const piecePrice = (product.price || 0) / (product.piecesPerPackage || 1);
            document.getElementById('modalProductPricePiece').innerText = `₦${piecePrice.toFixed(0).toLocaleString()}`;
            document.getElementById('modalProductPrice').innerText = `₦${(product.price || 0).toLocaleString()}`;
            document.getElementById('modalProductBuyingPrice').innerText = `₦${(product.buyingPrice || 0).toLocaleString()}`;
            document.getElementById('modalProductStock').innerText = product.stock || 0;
            document.getElementById('modalProductCategory').innerText = product.category || 'N/A';
            document.getElementById('modalProductPiecesPerPackage').innerText = product.piecesPerPackage || 1;
            document.getElementById('modalProductPackages').innerText = product.packages || 1;
            document.getElementById('modalProductExpiry').innerText = product.expiryDate || 'Not set';
            document.getElementById('modalProductPurchaseId').innerText = product.purchaseId || 'N/A';
            document.getElementById('modalProductCreated').innerText = product.createdAt ? new Date(product.createdAt).toLocaleString() : 'Unknown';
            document.getElementById('productModal').classList.remove('hidden');
        }

        function closeProductModal() {
            document.getElementById('productModal').classList.add('hidden');
        }

        function renderProducts() {
            const container = document.getElementById('productList');
            if (!container) return;
            if (filteredProducts.length === 0) {
                container.innerHTML = '<p class="text-center text-gray-500 py-10">No products match your filter</p>';
                return;
            }

            container.innerHTML = filteredProducts.map(p => {
                const lowStock = p.stock <= 5 ? '<span class="bg-red-500 text-white text-[8px] px-1.5 py-0.5 rounded-full font-black ml-2">LOW</span>' : '';
                const stockPercent = Math.min(100, (p.stock / 50) * 100);
                const barColor = p.stock <= 5 ? 'bg-red-500' : (p.stock <= 10 ? 'bg-orange-500' : 'bg-green-500');
                const piecePrice = (p.price || 0) / (p.piecesPerPackage || 1);
                const isBase64 = p.img && p.img.startsWith('data:image');
                const imageHtml = isBase64 ? `<img src="${p.img}" class="w-16 h-16 object-cover rounded-2xl">` : `<span class="text-2xl">${p.img || '📦'}</span>`;

                // Determine action buttons based on state
                let actionButtons = '';
                if (p.stock === 0) {
                    actionButtons += `<button onclick="event.stopPropagation(); deleteProduct('${p.id}')" class="text-red-500 hover:text-red-700 ml-2" title="Delete permanently"><i class="fas fa-trash"></i></button>`;
                }
                // Check if expired (expiry date exists and is before today)
                if (p.expiryDate) {
                    const expiry = new Date(p.expiryDate);
                    const today = new Date();
                    today.setHours(0, 0, 0, 0);
                    if (expiry < today) {
                        actionButtons += `<button onclick="event.stopPropagation(); disposeExpired('${p.id}')" class="text-orange-500 hover:text-orange-700 ml-2" title="Mark as expired and dispose"><i class="fas fa-hourglass-end"></i></button>`;
                    }
                }

                return `
                    <div class="bg-white dark:bg-gray-800 p-4 rounded-2xl shadow-sm border border-transparent hover:border-brand-accent/50 transition cursor-pointer" onclick="showProductDetails(${JSON.stringify(p).replace(/"/g, '&quot;')})">
                        <div class="flex gap-4">
                            <div class="w-16 h-16 bg-gray-100 dark:bg-gray-700 rounded-2xl flex items-center justify-center overflow-hidden">
                                ${imageHtml}
                            </div>
                            <div class="flex-1">
                                <div class="flex justify-between items-start">
                                    <div>
                                        <div class="flex items-center">
                                            <h3 class="font-bold text-sm dark:text-white">${p.name}</h3>
                                            ${lowStock}
                                        </div>
                                        <p class="text-[10px] text-gray-500 dark:text-gray-400">SKU: ${p.barcode ? p.barcode.slice(-6) : 'N/A'}</p>
                                        <p class="text-xs text-brand-accent font-bold mt-1">₦${piecePrice.toFixed(0).toLocaleString()} / piece</p>
                                    </div>
                                    <div class="text-right">
                                        <div class="flex items-center gap-1 price-edit" onclick="event.stopPropagation(); editPrice('${p.id}')">
                                            <span class="font-black text-sm dark:text-white">₦${p.price.toLocaleString()}</span>
                                            <i class="fas fa-pencil-alt text-xs"></i>
                                        </div>
                                        <p class="text-[8px] text-gray-400">per package</p>
                                        <div class="flex justify-end mt-1">${actionButtons}</div>
                                    </div>
                                </div>
                                <div class="mt-3">
                                    <div class="flex justify-between text-[10px] mb-1">
                                        <span class="font-bold">Stock: ${p.stock} Units</span>
                                        <span class="text-gray-400 dark:text-gray-500">Target: 50</span>
                                    </div>
                                    <div class="w-full bg-gray-100 dark:bg-gray-700 stock-bar">
                                        <div class="${barColor} h-full rounded-full" style="width: ${stockPercent}%"></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function editPrice(id) {
            const product = products.find(p => String(p.id) === String(id));
            if (!product) return;
            const newPriceStr = prompt(`Enter new package price for ${product.name}`, product.price);
            if (newPriceStr !== null) {
                const newPrice = parseFloat(newPriceStr);
                if (!isNaN(newPrice) && newPrice >= 0) {
                    const oldPrice = product.price;
                    product.price = newPrice;
                    saveProducts();
                    filteredProducts = filteredProducts.map(p => p.id === product.id ? product : p);
                    renderProducts();
                    logPriceChange(product, oldPrice, newPrice);
                    showToast(`Price updated to ₦${newPrice.toLocaleString()}`);
                } else {
                    alert("Invalid price. Please enter a positive number.");
                }
            }
        }

        // Delete product (only for out-of-stock)
        function deleteProduct(id) {
            if (!confirm('Are you sure you want to permanently delete this product?')) return;
            const productIndex = products.findIndex(p => String(p.id) === String(id));
            if (productIndex !== -1) {
                const deletedProduct = products[productIndex];

                // Save deletion log
                let deletionLogs = JSON.parse(localStorage.getItem('deletionLogs') || '[]');
                deletionLogs.push({
                    id: Date.now(),
                    productId: deletedProduct.id,
                    productName: deletedProduct.name,
                    productImg: deletedProduct.img,
                    reason: 'Manually deleted',
                    timestamp: new Date().toISOString()
                });
                localStorage.setItem('deletionLogs', JSON.stringify(deletionLogs));

                products.splice(productIndex, 1);
                saveProducts();
                filteredProducts = filteredProducts.filter(p => String(p.id) !== String(id));
                renderProducts();
                updateCounts();
                showToast('Product deleted');
            }
        }

        // Dispose expired product: create waste log and set stock to 0
        function disposeExpired(id) {
            const product = products.find(p => String(p.id) === String(id));
            if (!product) return;
            if (!confirm(`Mark ${product.name} as expired and dispose?`)) return;

            const piecePrice = (product.price || 0) / (product.piecesPerPackage || 1);
            const totalLoss = (product.stock || 0) * piecePrice;

            // Create waste log
            const wasteLogs = JSON.parse(localStorage.getItem('wasteLogs') || '[]');
            wasteLogs.push({
                id: Date.now(),
                productId: product.id,
                productName: product.name,
                productImg: product.img,
                quantity: product.stock || 0,
                piecePrice: piecePrice,
                totalLoss: totalLoss,
                reason: 'Expired',
                notes: 'Automatically disposed from inventory',
                timestamp: new Date().toISOString(),
                voided: false
            });
            localStorage.setItem('wasteLogs', JSON.stringify(wasteLogs));

            // Set stock to 0 (or you could remove the product entirely)
            product.stock = 0;
            saveProducts();
            filteredProducts = filteredProducts.map(p => p.id === product.id ? product : p);
            renderProducts();
            updateCounts();
            showToast(`Disposed ${product.name} – ₦${totalLoss.toLocaleString()}`);
        }

        function updateCounts() {
            const total = products.length;
            const low = products.filter(p => p.stock <= 5).length;
            const expired = products.filter(p => {
                if (!p.expiryDate) return false;
                const expiry = new Date(p.expiryDate);
                const today = new Date();
                today.setHours(0, 0, 0, 0);
                return expiry < today;
            }).length;
            const totalEl = document.getElementById('totalCount');
            const lowEl = document.getElementById('lowCount');
            const expiredEl = document.getElementById('expiredCount');
            if (totalEl) totalEl.innerText = total;
            if (lowEl) lowEl.innerText = low;
            if (expiredEl) expiredEl.innerText = expired;
        }

        const searchInput = document.getElementById('searchInput');
        if (searchInput) {
            searchInput.addEventListener('input', function (e) {
                const query = e.target.value.toLowerCase();
                filteredProducts = products.filter(p =>
                    (p.name && p.name.toLowerCase().includes(query)) ||
                    (p.barcode && p.barcode.includes(query))
                );
                renderProducts();
            });
        }

        function filterByAll() {
            filteredProducts = [...products];
            renderProducts();
            setActiveChip('[data-category="all"]');
        }

        function filterByLowStock() {
            filteredProducts = products.filter(p => p.stock <= 5);
            renderProducts();
            setActiveChip('[data-category="low"]');
        }

        function filterByOutOfStock() {
            filteredProducts = products.filter(p => p.stock === 0);
            renderProducts();
            setActiveChip('[data-category="out"]');
        }

        function filterByExpired() {
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            filteredProducts = products.filter(p => {
                if (!p.expiryDate) return false;
                const expiry = new Date(p.expiryDate);
                return expiry < today;
            });
            renderProducts();
            setActiveChip('[data-category="expired"]');
        }

        function filterByCategory(category) {
            filteredProducts = products.filter(p => p.category === category);
            renderProducts();
            setActiveChip(`[data-category="${category}"]`);
        }

        function resetFilters() {
            filterByAll();
        }

        function setActiveChip(selector) {
            document.querySelectorAll('.filter-chip').forEach(chip => chip.classList.remove('active'));
            const activeChip = document.querySelector(selector);
            if (activeChip) activeChip.classList.add('active');
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            if (toast) {
                toast.innerText = msg;
                toast.classList.remove('hidden');
                setTimeout(() => toast.classList.add('hidden'), 2000);
            } else {
                alert(msg);
            }
        }

        window.addEventListener('storage', (e) => {
            if (e.key === 'products') {
                loadProducts();
            }
        });

        // Optional: voided items handling (if you use voided flag)
        // The following lines were at the end of your original script; they don't affect anything.
        // I'm keeping them but they are not used.
        const allTransactions = JSON.parse(localStorage.getItem('transactions') || '[]');
        const activeTransactions = allTransactions.filter(t => !t.voided);
        const allPriceLogs = JSON.parse(localStorage.getItem('priceLogs') || '[]');
        const activePriceLogs = allPriceLogs.filter(p => !p.voided);
        const allDebts = JSON.parse(localStorage.getItem('debts') || '[]');
        const activeDebts = allDebts.filter(d => !d.voided);
        const allUploads = JSON.parse(localStorage.getItem('uploadHistory') || '[]');
        const activeUploads = allUploads.filter(u => !u.voided);

        loadProducts();
    </script>
    <script>
  (function() {
    const toggleBtn = document.getElementById('theme-toggle') || document.getElementById('darkModeToggle');
    if (!toggleBtn) return;

    // Load saved preference
    if (localStorage.getItem('darkMode') === 'true') {
      document.body.classList.add('dark');
    }

    // Toggle function
    toggleBtn.addEventListener('click', () => {
      document.body.classList.toggle('dark');
      localStorage.setItem('darkMode', document.body.classList.contains('dark'));
    });
  })();
</script>
</body>

</html>
